<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <title>FAiND — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 100%);
        color: #0f172a;
      }
      .card {
        max-width: 24rem;
        width: 100%;
        text-align: center;
        padding: 2rem 1.5rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(20px);
      }
      img { width: 64px; height: 64px; margin-bottom: 1rem; }
      h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
      p { font-size: 0.875rem; color: #64748b; line-height: 1.5; margin-bottom: 1.25rem; }
      button {
        appearance: none;
        border: none;
        border-radius: 0.75rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        background: #3b82f6;
        cursor: pointer;
      }
      button:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/pwa-192x192.png" alt="FAiND" />
      <h1>You are offline</h1>
      <p>
        FAiND needs a live connection for items, matches, and messages.
        Cached pages may still be available — reconnect to refresh.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
